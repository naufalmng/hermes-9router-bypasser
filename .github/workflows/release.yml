name: release

# Builds the obfuscated client for every supported platform and publishes it
# with SHA256SUMS. The server binary is built too, but it is meant to be run
# from a private host — it is published for convenience only.
#
# Required repository secrets:
#   H9B_SERVERID  base64 Ed25519 public key of the licence server
#                 (read it from `journalctl -u h9bd | grep -o 'serverID=[^ ]*'`)
#
# Without H9B_SERVERID the build is a dev build: it warns at runtime and does not
# authenticate the server, so payloads would be accepted from any relay. The
# release target refuses to build without it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to stamp into the binary"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: install garble
        # pinned: @latest now requires Go >= 1.27 and produces a bigger binary
        # that leaks JSON field names as plaintext strings
        run: go install mvdan.cc/garble@v0.12.1

      - name: verify payloads parse
        run: |
          go build -trimpath -o /tmp/h9bd ./cmd/h9bd
          /tmp/h9bd payload check -dir ./payloads

      - name: build release
        env:
          SERVERID: ${{ secrets.H9B_SERVERID }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          make release SERVERID="$SERVERID" VERSION="$VERSION"

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h9b-release
          path: dist/

      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/h9b-*
            dist/SHA256SUMS
